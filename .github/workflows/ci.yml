name: ROS checks

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:12f03ad224f4f7801c4eeb320934b198fe0b9536d70f2f617894da08ca3bedba
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w04-fec6b4e886c1.tar.gz
      COURSE_KIT_SHA256: fec6b4e886c19146078bf69fbf90a19279a4cd33f656642395350b299efeb226
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build ROS packages
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile \
            src/turtle_bringup/launch/sim.launch.py \
            src/patrol/patrol/patrol.py
      - name: Test ROS packages
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon test --packages-select turtle_bringup patrol --event-handlers console_direct+
          colcon test-result --verbose
      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
      - name: Check PR04 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR04 --submission .
